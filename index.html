<!doctype html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<title>QuranTV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 🔑🔑🔑 عنصر إلزامي في CAF Web Receiver v3: PlayerManager يرتبط به، وبدونه يرمي
       ctx.start() استثناءً (TypeError: reading 'g') فلا يبلّغ المستقبلُ المرسِلَ أنه جاهز،
       فينتظر المرسِل ٦٠ ثانية ثم يفشل بـ"Session start failed. Error code 2473".
       أُثبِت فعليًا على الشيلد ٢٠٢٦-٠٩-٠٦: الصفحة حمّلت ووصلت APP_STATE_STARTED والساعة
       تتحدّث (renderClock قبله بأسطر) لكن ctx.start() في آخر سطر لم ينجح.
       نُبقيه بالحجم الكامل وظاهرًا (لا display:none) حتى لا نكسر أي قياس داخلي للـSDK،
       ونغطّيه بطبقة .veil معتمة تحمل نفس خلفية الصفحة، وواجهتنا فوقها -->
  <cast-media-player></cast-media-player>
  <div class="veil"></div>

  <div class="top">
    <div class="brand">
      <div class="kareem" id="kareem">القرآن الكريم</div>
      <div class="reciter" id="reciter"></div>
    </div>
    <div class="clock">
      <div class="time" id="time">١٠:٤٩ <small>م</small></div>
      <div class="date" id="date">٠٦/٠٩/٢٠٢٦</div>
    </div>
  </div>

  <div class="stage"></div>
  <div class="surah" id="surah"></div>

  <div class="bottom">
    <div class="main-row">
      <div class="big" id="playBtn"><svg id="playIcon" viewBox="0 0 24 24"></svg></div>
      <div class="bars">
        <div class="row">
          <div class="num l" id="elapsed">٥٢:٣٣</div>
          <div class="track"><div class="fill" style="width:39%"><span class="knob"></span></div></div>
          <div class="num r" id="remain">-٨٢:٠١</div>
        </div>
        <div class="row">
          <div class="num l" id="ayahNow">آية ١٣٦</div>
          <div class="track"><div class="fill" style="width:47.5%"><span class="knob"></span></div></div>
          <div class="num r" id="ayahTotal">٢٨٦</div>
        </div>
      </div>
    </div>
    <!-- 🔑 سهمان رأسيان لا أفقيان: مفتاحا الريموت المربوطان بتغيير السورة هما ↑ و↓ (يمين/يسار
         محجوزان لتقديم/تأخير داخل السورة بمعالج الـSDK)، فالأيقونة تطابق المفتاح الفعلي.
         أيقونة التكرار أُزيلت بطلب صريح من المستخدم - كانت مؤشرًا معطّلاً دائمًا بلا وظيفة -->
    <div class="small-row">
      <div class="small"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></div>
      <div class="small"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></div>
    </div>
  </div>

</body>
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script src="receiver.js"></script>
</html>
